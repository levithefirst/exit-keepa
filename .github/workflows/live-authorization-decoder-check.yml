name: Live authorization decoder check

# Manual only - read-only investigation of the deployed getModulesPaginated
# decoder against a real Base Safe with an already-documented, independently
# verified Zodiac Roles Modifier. Never signs or deploys anything. See
# scripts/live-authorization-decoder-check.mjs.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API URL to test"
        default: "https://api-production-2e11.up.railway.app"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run live authorization decoder check
        run: node scripts/live-authorization-decoder-check.mjs
        env:
          API_URL: ${{ inputs.api_url }}
